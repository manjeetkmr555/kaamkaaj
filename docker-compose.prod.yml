services:
  database:
    platform: linux/amd64
    image: ${DOCKERHUB_USERNAME}/kaamkaaj-database:latest
    env_file:
      - env/database.prod.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    platform: linux/amd64
    image: ${DOCKERHUB_USERNAME}/kaamkaaj-backend:latest
    env_file:
      - env/backend.prod.env
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    image: ${DOCKERHUB_USERNAME}/kaamkaaj-frontend:latest
    env_file:
      - env/frontend.prod.env
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
