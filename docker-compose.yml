services:
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    image: kaamkaaj-database:latest
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: kaamkaaj-backend:latest
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME:-manjeetkmr555}/kaamkaaj-frontend:latest
    pull_policy: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pg_data:
